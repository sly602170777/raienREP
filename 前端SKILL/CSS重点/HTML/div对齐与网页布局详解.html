<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">  
<html xmlns="http://www.w3.org/1999/xhtml">  
<head>  
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />  
<title>div</title>  
</head>  
  
<body>  
<!--默认情况下的div对齐-->  
<div style="background:#aa0; width:15%; height:100px;"></div>  
<div style="background:#0a0; width:15%; height:100px;"></div>  
<!--更换对齐方式，必须使用clear:both换行，这个换行符的高度为10px，默认为0px，颜色同网页的背景色-->  
<div style="clear:both; height:10px;"></div>  
<!--使用了行内右对齐的方式，是先写最右图层，再写次右图层，与常人思维相反-->  
<div style="background:rgb(239, 167, 167); width:10%; height:100px; float:right; margin-right:10%">右对齐B</div>  
<div style="background:rgb(192, 192, 246); width:90%; height:100px; ;">左对齐A</div>  
<div style="clear:both; height:10px;"></div>  
<!--使用行内左对齐方式-->  
<div style="background:#0f0; width:10%; height:100px; float:left;">左对齐A</div>  
<div style="background:#F00; width:10%; height:100px; float:left;">左对齐B</div>  
<div style="clear:both; height:10px;"></div>  
<div style="background:#00f; width:10%; height:100px; float:left;"></div>  
<!--如果你更换对齐方式，这里是希望从行内左对齐更变成一个无论大小的图层占用一行，而不用clear:both换行的话，这两个图层会叠放在一起，出错-->  
<div style="background:#0af; width:15%; height:100px;"></div>  
<!--此乃正确的使用方式。-->  
<div style="clear:both; height:10px;"></div>  
<div style="background:#aa0; width:15%; height:100px;"></div>  
<div style="background:#0a0; width:15%; height:100px;"></div>  
<div style="background:#eee; width:15%; height:100px; position:absolute; top:5%; left:80%;">游离于体系之外AAA</div>  
<div style="background:#aaa; width:100%; height:30px; position:fixed; top:0%;left:0%">游离于体系之外BBBB</div>  
<!--下面两个图层，只是为了说明上面两行代码可以放在任何位置，但不影响网页布局之用-->  
<div style="background:#aa0; width:15%; height:100px;"></div>  
<div style="background:#0a0; width:15%; height:100px;"></div>  
</body>  
</html>
