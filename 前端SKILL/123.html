<body>
    <form>
        <h1>支払証明書 兼 立替金精算書</h1>
        <div class="kubun1">
            <div class="section">
                <label for="issue-date">発行日:</label>
                <input type="date" id="issue-date" name="issue-date">
            </div>
            <div class="section">
                <label for="payer-name">所属:</label>
                <input type="text" id="payer-name" name="payer-name">
            </div>
            <div class="section">
                <label for="payment-details">支払氏名:</label>
                <input id="payment-details" name="payment-details" rows="4"></input>
            </div>
        </div>
 

        <!-- <div class="section">
            <label for="payment-amount">支払額:</label>

        </div> -->
        <div class="checkbox-group">
            <div>
                <label><input type="checkbox" name="reason" value="education"> 教育費1</label>
            </div>
            <div>
                <label><input type="checkbox" name="reas.on" value="entertainment"> 交際費/会議費</label>
            </div>
            <div>
                <label><input type="checkbox" name="reason" value="purchase"> 物品購入</label>
            </div>
            <div>
                <label><input type="checkbox" name="reason" value="other"> その他</label>
            </div>    
        </div>
        <!-- <button type="submit">送信</button> -->
